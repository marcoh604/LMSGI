<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <h2>Información Personal</h2>
    <form>
        <label for="nombre" required>Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="apellido" required>Apellido:</label>
        <input type="text" id="apellido" name="apellido" required><br><br>

        <label for="Fecha de nacimiento" required>Fecha de nacimiento:</label>
        <input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento" required><br><br>

        <input type="radio" id="masculino" name="genero" value="masculino" required>
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="femenino" name="genero" value="femenino" required>
        <label for="femenino">Femenino</label><br><br>
        <input type="radio" id="otro" name="genero" value="otro" required>
        <label for="otro">Otro</label><br><br>
 <h2>Información de contacto</h2>
        <label for="correo" required>Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required><br><br>
        <label for="telefono" required>Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required><br><br>
        <label for="direccion" required>Dirección:</label>
        <input type="text" id="direccion" name="direccion" required><br><br>
       
       <h2>Información de Cuenta</h2>
        <label for="usuario" required>Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario" required><br><br>
        <label for="contrasena" required>Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required><br><br>
        <label for="confirmar_contrasena" required>Confirmar contraseña:</label>
        <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" required><br><br>
        
        <h2>Preferencias</h2>
        <label for="color" required>Color favorito:</label>
        <input type="radio" id="color" name="color" value="rojo" required>
        <label for="rojo">Rojo</label>
        <input type="radio" id="color" name="color" value="verde" required>
        <label for="verde">Verde</label>
        <input type="radio" id="color" name="color" value="azul" required>
        <label for="azul">Azul</label><br><br>
        <label for="terminos y condiciones" required>Acepto los términos y condiciones:</label>
        <input type="checkbox" id="terminos y condiciones" name="terminos y condiciones" required><br><br>
        <input type="submit" value="Registrar">
    </form>
</body>
</html>
